name: Firmware Matrix Test

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - model: "SM-G981N"
            csc: "KOO"
            omc: "OKR"
          - model: "SM-G986N"
            csc: "KOO"
            omc: "OKR"
          - model: "SM-G988N"
            csc: "KOO"
            omc: "OKR"

    steps:
      - name: Test matrix
        run: |
          echo "Model: ${{ matrix.model }}"
          echo "CSC: ${{ matrix.csc }}"
          echo "OMC: ${{ matrix.omc }}"